name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo | openssl s_client -connect dev.mcst.ru:443 -servername dev.mcst.ru 2>/dev/null > cert.txt
        openssl x509 -in cert.txt -noout -subject -issuer -dates -fingerprint -sha256
        echo "pin sha256//$(openssl x509 -in cert.txt -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64)"
        mkdir out
        curl -sSk -L --max-time 60 https://dev.mcst.ru/download/ -o out/download.html
        wc -c out/download.html
        grep -oE 'href="[^"]*"' out/download.html | sort -u
    - uses: actions/upload-artifact@v4
      with:
        name: page
        path: out
